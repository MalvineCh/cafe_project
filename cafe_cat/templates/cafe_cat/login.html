<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Вход / Регистрация</title>
    <style>
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-position: center;
            color: white;
            background: url('/media/menu_item_images/фон.jpg') no-repeat center center fixed;
            background-size: cover;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        p {
            font-family: 'Trebuchet MS', Helvetica, sans-serif;
        }
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-top: 50px;
        }
        .window {
            width: 600px;
            height: 300px;
            background-color: #5a3420;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text1 {
            font-size: 25px;
            color: white;
        }
        .window input[type="text"],
        .window input[type="password"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .window button {
            padding: 10px 20px;
            background-color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: #784627;
        }
        .buttons {
            margin-top: 10px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #5a3420;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Trebuchet MS', Helvetica, sans-serif;
            text-decoration: none;
        }
        .button1 {
            margin: 10px;
        }
        .header {
            color: #fff;
            font-size: 30px;
            margin-top: -70px;
            font-family: 'Trebuchet MS', Helvetica, sans-serif;
        }
        .logo img {
            width: 10%;
            bottom: 200px;
        }
        footer {
            background: #23292e;
            color: #fff;
            padding: 30px 0 20px 0;
            text-align: center;
            width: 100%;
            z-index: 10;
            border-top: 1px solid #444;
            margin-top: 40px;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .footer-info {
            text-align: left;
            min-width: 200px;
        }
        .footer-btn {
            margin: 10px 0;
        }
        .footer-btn a {
            padding: 12px 32px;
            border: 2px solid #fff;
            border-radius: 10px;
            background: none;
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="header">
                <p>Сеть кафе Nutri Cafe</p>
            </div>
            <div class="buttons">
                <a href="{% url 'cafe_cat:view_cart' %}" class="button">Корзина</a>
                <a href="{% url 'cafe_cat:user_orders' %}" class="button">Заказы</a>
                <a href="{% url 'cafe_cat:menu' %}" class="button">Меню</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'cafe_cat:account' %}" class="button">Аккаунт</a>
                {% else %}
                    <a href="{% url 'cafe_cat:login' %}" class="button">Войти</a>
                    <a href="{% url 'cafe_cat:register' %}" class="button">Зарегистрироваться</a>
                {% endif %}
            </div>
            <div class="window">
                <div class="text1">
                    <p>Вход</p>
                    <form action="{% url 'cafe_cat:login' %}" method="post">
                        {% csrf_token %}
                        <input type="text" name="username" placeholder="Логин" required>
                        <input type="password" name="password" placeholder="Пароль" required>
                    <button type="submit" class="button1">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <div style="font-size: 22px; font-weight: bold; margin-bottom: 8px;">Nutri Cafe</div>
                <div style="font-size: 16px; margin-bottom: 4px;">+7 (777) 777-77-77</div>
                <div style="font-size: 16px; margin-bottom: 4px;">nutricafe@mail.ru</div>
                <div style="font-size: 14px; color: #bfbfbf;">ООО "Nutri Cafe" © 2025</div>
            </div>
            <div class="footer-btn">
                <a href="{% url 'cafe_cat:support' %}">Обратиться в поддержку</a>
            </div>
        </div>
    </footer>
</body>
</html>
